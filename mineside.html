<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <meta name="theme-color" content="#6fa79f" />

    <!-- nix pille -->
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="icons/favicon-16x16.webp" type="image/x-icon">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.180x180.webp">

    <script>
        // Check that service workers are registered
        if ('serviceWorker' in navigator) {
            // Use the window load event to keep the page load performant
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="header" id="up">
        <nav class="header__menu">

            <img src="icons/apple-touch-icon.180x180.webp" alt="Green" class="header__img">

            <p class="header__text">Pulsen 8, 4000</p>

        </nav>
    </header>


    <main>
        <div class="container">
            <div class="sign-in__container">

                <img src="icons/icon-192x192.webp" alt="GreenFit Logo" class="sign-in__img">
                <h1 class="sign-in__title">GreenFit</h1>

            </div>

            <form action="login.html" method="post" id="form" class="form" novalidate>
                <div class="sign-in">


                    <label for="username" class="username">Brugernavn:</label>
                    <input type="text" id="username">

                    <label for="password" class="password">Adgangskode:</label>
                    <input type="password" id="password">

                    <button class="submit__button" type="submit">Login ind</button>
                    <label>
                        <input class="husk-mig" type="checkbox" checked="checked" name="remember"> Husk mig
                    </label>
                </div>

                <div class="new-account">
                    <p class="new">Ny bruger:<a class="link" href="new.html"> Tilmeld dig her</a></p>
                </div>
                <div class="forgot-psw">
                    <p class="psw">Glemt:<a class="link" href="access.html"> Adgangskode</a></p>
                </div>
            </form>
        </div>
    </main>


    <!-- footer -->
    <footer class="footer">

        <div class="footer__div">

            <a href="index.html" class="footer__link">
                <img src="icons/hjem.png" alt="Hjem" class="icon__footer">
                <span>Hjem</span>
            </a>

            <a href="mineside.html" class="footer__link footer__link--chose">
                <img src="icons/min-side.png" alt="Min side" class="icon__footer">
                <span>Min side</span>
            </a>

            <a href="regler.html" class="footer__link">
                <img src="icons/regler.png" alt="Regler" class="icon__footer">
                <span>Regler</span>
            </a>

            <a href="kontakt.html" class="footer__link">
                <img src="icons/kontakt.png" alt="Kontakt" class="icon__footer">
                <span>Kontakt</span>
            </a>

        </div>

    </footer>

</body>

</html>
